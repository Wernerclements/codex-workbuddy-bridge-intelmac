[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workbuddy-bridge-intelmac"
version = "0.1.0a1"
description = "A local MCP bridge between Codex and WorkBuddy on Intel Mac"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
